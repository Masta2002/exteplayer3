name: FFmpeg 9 with the OE-A patches

# Builds FFmpeg 9.0.2 with the patch series in ffmpeg-patches/ (OE-A's
# FFmpeg 9 patches plus the ffmpeg-ext ones ported to 9), then exteplayer3
# against it, and runs small checks of the patched demuxers.

on:
  push:
    paths:
      - 'ffmpeg-patches/**'
      - '.github/ffmpeg9-tests/**'
      - '.github/workflows/ffmpeg9-oea.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential pkg-config autoconf automake libtool nasm \
          libxml2-dev libssl-dev libbluray-dev librtmp-dev libudfread-dev \
          zlib1g-dev libbz2-dev liblzma-dev libx264-dev

    - name: Patch FFmpeg 9.0.2
      run: |
        mkdir ffsrc && cd ffsrc
        curl -sL --retry 5 --retry-all-errors https://github.com/FFmpeg/FFmpeg/archive/refs/tags/n9.0.2.tar.gz -o ff.tar.xz
        tar -xf ff.tar.xz --strip-components=1
        while read -r p; do
          case "$p" in ''|'#'*) continue;; esac
          echo "== $p"
          patch -p1 --no-backup-if-mismatch -s < "../ffmpeg-patches/$p"
        done < ../ffmpeg-patches/series

    - name: Build FFmpeg
      run: |
        cd ffsrc
        ./configure --prefix=$HOME/ffmpeg --enable-shared --disable-static --disable-doc \
          --enable-gpl --enable-version3 --enable-libxml2 --enable-openssl --enable-libx264 --enable-zlib \
          --extra-cflags="-Werror=implicit-function-declaration -Werror=incompatible-pointer-types -Werror=int-conversion"
        make -j$(nproc) install

    - name: FATE tests of the HLS discontinuity patch
      run: |
        cd ffsrc
        export LD_LIBRARY_PATH=$HOME/ffmpeg/lib
        make -j$(nproc) fate-hls-discontinuity fate-hls-discontinuity-seek fate-hls-discontinuity-notag-live || {
          cat tests/data/fate/hls-discontinuity*.err tests/data/fate/hls-discontinuity*.diff 2>/dev/null
          exit 1
        }

    - name: Build exteplayer3
      run: |
        ./autogen.sh
        PKG_CONFIG_PATH=$HOME/ffmpeg/lib/pkgconfig ./configure
        make -j$(nproc)
        LD_LIBRARY_PATH=$HOME/ffmpeg/lib ./exteplayer3 2>&1 | grep -q -- '-Q'

    - name: Build exteplayer3 of oe-alliance master
      run: |
        git clone --depth 1 https://github.com/oe-alliance/exteplayer3 upstream
        cd upstream
        ./autogen.sh
        PKG_CONFIG_PATH=$HOME/ffmpeg/lib/pkgconfig ./configure
        make -j$(nproc)

    - name: Check the patched demuxers
      env:
        LD_LIBRARY_PATH: /home/runner/ffmpeg/lib
      run: |
        set -eux
        FF=$HOME/ffmpeg/bin/ffmpeg; FP=$HOME/ffmpeg/bin/ffprobe
        mkdir t && cd t
        # HLS with WebVTT subtitles
        printf 'WEBVTT\n\n00:00:01.000 --> 00:00:03.000\nhello\n' > sub.vtt
        $FF -v error -f lavfi -i testsrc=d=6:s=160x90 -f lavfi -i sine=d=6 -i sub.vtt \
            -map 0:v -map 1:a -map 2:s -c:v libx264 -g 25 -c:a aac -c:s webvtt \
            -f hls -hls_time 2 -hls_playlist_type vod -master_pl_name master.m3u8 \
            -var_stream_map "v:0,a:0,s:0,sgroup:subs" hls_%v.m3u8
        $FP -v error -show_entries stream=codec_type -of csv=p=0 master.m3u8 | sort | tee hls.txt
        grep -q video hls.txt; grep -q audio hls.txt
        # DASH
        $FF -v error -f lavfi -i testsrc=d=6:s=160x90 -f lavfi -i sine=d=6 -c:v libx264 -g 25 -c:a aac \
            -f dash -seg_duration 2 dash.mpd
        $FP -v error -show_entries stream=codec_type -of csv=p=0 dash.mpd | sort | tee dash.txt
        grep -q video dash.txt; grep -q audio dash.txt
        $FF -v error -i dash.mpd -f null -
        # CENC encrypted MP4, decrypted by key
        K=00112233445566778899aabbccddeeff
        $FF -v error -f lavfi -i testsrc=d=3:s=160x90 -c:v libx264 -encryption_scheme cenc-aes-ctr \
            -encryption_key $K -encryption_kid 0102030405060708090a0b0c0d0e0f10 enc.mp4
        $FF -v error -decryption_key $K -i enc.mp4 -f null -

    # Patches 0051 (hls) and 0052 (dashdec): a track that the player switches
    # in during playback (AVStream.discard from ALL to DEFAULT) has to arrive,
    # and at the playing position. track_switch.c reads generated streams with
    # two audio tracks: HLS with two audio renditions, DASH with a
    # SegmentTimeline, with segments of a fixed duration (the two audio
    # representations have segments of 1 and 3 seconds, so their segment
    # numbers do not match) and DASH with single files.
    - name: Tracks switched in during playback (patches 0051 and 0052)
      env:
        LD_LIBRARY_PATH: /home/runner/ffmpeg/lib
      run: |
        set -eux
        FF=$HOME/ffmpeg/bin/ffmpeg; FP=$HOME/ffmpeg/bin/ffprobe
        gcc -O1 -Wall -Werror -o track_switch .github/ffmpeg9-tests/track_switch.c \
            $(PKG_CONFIG_PATH=$HOME/ffmpeg/lib/pkgconfig pkg-config --cflags --libs libavformat libavcodec libavutil) -lm
        mkdir -p sw/hls sw/tl sw/dur sw/sf && cd sw
        A="-f lavfi -i sine=f=440:d=30 -f lavfi -i sine=f=880:d=30"
        $FF -v error -f lavfi -i testsrc=d=30:s=160x90:r=25 $A -map 0:v -map 1:a -map 2:a \
            -c:v libx264 -g 25 -c:a aac -b:a 64k -f hls -hls_time 2 -hls_playlist_type vod \
            -master_pl_name master.m3u8 \
            -var_stream_map "v:0,agroup:aud a:0,agroup:aud,default:yes a:1,agroup:aud" hls/p%v.m3u8
        cat hls/master.m3u8
        AS="id=0,seg_duration=1,streams=0 id=1,seg_duration=3,streams=1"
        $FF -v error $A -map 0:a -map 1:a -c:a aac -b:a 64k -f dash -adaptation_sets "$AS" tl/a.mpd
        $FF -v error $A -map 0:a -map 1:a -c:a aac -b:a 64k -f dash -use_timeline 0 -adaptation_sets "$AS" dur/a.mpd
        cat tl/a.mpd dur/a.mpd
        $FF -v error -f lavfi -i sine=f=440:d=30 -c:a aac -b:a 64k -movflags +faststart sf/a.mp4
        $FF -v error -f lavfi -i sine=f=880:d=30 -c:a aac -b:a 64k -movflags +faststart sf/b.mp4
        {
          echo '<?xml version="1.0" encoding="utf-8"?>'
          echo '<MPD xmlns="urn:mpeg:dash:schema:mpd:2011" profiles="urn:mpeg:dash:profile:isoff-on-demand:2011" type="static" mediaPresentationDuration="PT30S" minBufferTime="PT2S">'
          echo '<Period id="0" start="PT0S">'
          for r in a b; do
            echo "<AdaptationSet id=\"$r\" contentType=\"audio\" lang=\"en\">"
            echo "<Representation id=\"$r\" mimeType=\"audio/mp4\" codecs=\"mp4a.40.2\" bandwidth=\"64000\" audioSamplingRate=\"44100\">"
            echo "<BaseURL>$r.mp4</BaseURL>"
            echo '</Representation>'
            echo '</AdaptationSet>'
          done
          echo '</Period>'
          echo '</MPD>'
        } > sf/a.mpd
        cat sf/a.mpd
        for m in hls/master.m3u8 tl/a.mpd dur/a.mpd sf/a.mpd; do
          $FP -v error -show_entries stream=index,codec_type -of csv=p=0 $m
          ../track_switch $m 6 near 0.5
        done

    # The patches 0050, 0051 and 0052 must not change anything for a caller
    # that does not switch tracks (and 0050 nothing for HLS without
    # #EXT-X-DISCONTINUITY): the build tree gets libavformat without 0052,
    # 0051 and the hls.c part of 0050 (the installed one keeps them), both
    # read the same streams and must give the same output. The demuxers
    # without the patches also show that track_switch tests something: HLS
    # never delivers the track that is switched in (OE-A patch 0008), DASH
    # starts it somewhere else. Runs last, the tree is not installed again.
    - name: HLS and DASH unchanged by the patches 0050 to 0052 without a track switch
      run: |
        set -eux
        cd ffsrc
        awk '/^diff --git /{p = ($0 ~ /^diff --git a\/libavformat\/hls\.c /)} p' \
            ../ffmpeg-patches/0050-*.patch > ../hls0050.diff
        test -s ../hls0050.diff
        patch -R -p1 --no-backup-if-mismatch -s < ../ffmpeg-patches/0052-*.patch
        patch -R -p1 --no-backup-if-mismatch -s < ../ffmpeg-patches/0051-*.patch
        patch -R -p1 --no-backup-if-mismatch -s < ../hls0050.diff
        grep -A3 'if (c->first_packet) {' libavformat/hls.c
        make -j$(nproc)
        REF=$PWD/libavutil:$PWD/libavcodec:$PWD/libavformat:$PWD/libavdevice:$PWD/libavfilter:$PWD/libswscale:$PWD/libswresample
        NEW=$HOME/ffmpeg/lib
        reflib=$(LD_LIBRARY_PATH=$REF ldd ./ffmpeg | awk '/libavformat/ {print $3}')
        newlib=$(LD_LIBRARY_PATH=$NEW ldd ./ffmpeg | awk '/libavformat/ {print $3}')
        echo "unpatched: $reflib  patched: $newlib"
        test "$(grep -c 'Timeline anchor' "$reflib" || true)" = 0
        test "$(grep -c 'Timeline anchor' "$newlib")" -gt 0
        # FATE test of a tag-less live playlist: both demuxers against the reference
        # (generated by the unpatched one if the patch does not ship it yet)
        T=fate-hls-discontinuity-notag-live
        if [ ! -f tests/ref/fate/hls-discontinuity-notag-live ]; then
          LD_LIBRARY_PATH=$REF make $T GEN=1 || true
        fi
        cat tests/ref/fate/hls-discontinuity-notag-live
        LD_LIBRARY_PATH=$REF make $T
        LD_LIBRARY_PATH=$NEW make $T
        # the same segments as VOD, read through and with a seek
        sed '$a #EXT-X-ENDLIST' tests/data/hls_notag_live.m3u8 > tests/data/hls_notag_vod.m3u8
        cat tests/data/hls_notag_vod.m3u8
        for lib in REF NEW; do
          export LD_LIBRARY_PATH=${!lib}
          ./ffmpeg -nostdin -v error -flags +bitexact -i tests/data/hls_notag_vod.m3u8 \
              -c copy -fflags +bitexact -f framecrc - > ../vod_$lib.txt
          ./ffmpeg -nostdin -v error -flags +bitexact -ss 1.2 -i tests/data/hls_notag_vod.m3u8 \
              -t 1 -c copy -fflags +bitexact -f framecrc - > ../vodseek_$lib.txt
          ./ffmpeg -nostdin -v error -flags +bitexact -live_start_index -2 -max_reload 1 \
              -i tests/data/hls_notag_live.m3u8 -c copy -fflags +bitexact -f framecrc - > ../liveedge_$lib.txt
        done
        # the streams of the track switch check, without a switch: read
        # through, with a seek, and one track only (ffmpeg discards the others)
        for lib in REF NEW; do
          export LD_LIBRARY_PATH=${!lib}
          for n in hls tl dur sf; do
            m=../sw/$n/a.mpd
            if [ $n = hls ]; then m=../sw/hls/master.m3u8; fi
            ./ffmpeg -nostdin -v error -flags +bitexact -i $m -map 0 \
                -c copy -fflags +bitexact -f framecrc - > ../sw_${n}_all_$lib.txt
            ./ffmpeg -nostdin -v error -flags +bitexact -ss 7.3 -i $m -map 0 \
                -t 4 -c copy -fflags +bitexact -f framecrc - > ../sw_${n}_seek_$lib.txt
            ./ffmpeg -nostdin -v error -flags +bitexact -i $m -map 0:a:1 \
                -c copy -fflags +bitexact -f framecrc - > ../sw_${n}_one_$lib.txt
          done
        done
        # without the patches the track that is switched in does not arrive
        # (HLS) or not at the playing position (DASH)
        export LD_LIBRARY_PATH=$REF
        (cd ../sw && ../track_switch hls/master.m3u8 6 none 0.5)
        for n in tl dur sf; do
          (cd ../sw && ../track_switch $n/a.mpd 6 far 0.5)
        done
        unset LD_LIBRARY_PATH
        for t in vod vodseek liveedge; do
          cat ../${t}_NEW.txt
          diff -u ../${t}_REF.txt ../${t}_NEW.txt
        done
        for n in hls tl dur sf; do
          for t in all seek one; do
            wc -l ../sw_${n}_${t}_NEW.txt
            test "$(grep -vc '^#' ../sw_${n}_${t}_NEW.txt)" -gt 100
            diff -u ../sw_${n}_${t}_REF.txt ../sw_${n}_${t}_NEW.txt
          done
        done
