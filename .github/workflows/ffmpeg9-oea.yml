name: FFmpeg 9 with the OE-A patches

# Builds FFmpeg 9.0.2 with the patch series in ffmpeg-patches/ (OE-A's
# FFmpeg 9 patches plus the ffmpeg-ext ones ported to 9), then exteplayer3
# against it, and runs small checks of the patched demuxers.

on:
  push:
    paths:
      - 'ffmpeg-patches/**'
      - '.github/ffmpeg9-tests/**'
      - '.github/workflows/ffmpeg9-oea.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential pkg-config autoconf automake libtool nasm \
          libxml2-dev libssl-dev libbluray-dev librtmp-dev libudfread-dev \
          zlib1g-dev libbz2-dev liblzma-dev libx264-dev

    - name: Patch FFmpeg 9.0.2
      run: |
        mkdir ffsrc && cd ffsrc
        curl -sL --retry 5 --retry-all-errors https://github.com/FFmpeg/FFmpeg/archive/refs/tags/n9.0.2.tar.gz -o ff.tar.xz
        tar -xf ff.tar.xz --strip-components=1
        while read -r p; do
          case "$p" in ''|'#'*) continue;; esac
          echo "== $p"
          patch -p1 --no-backup-if-mismatch -s < "../ffmpeg-patches/$p"
        done < ../ffmpeg-patches/series

    - name: Build FFmpeg
      run: |
        cd ffsrc
        ./configure --prefix=$HOME/ffmpeg --enable-shared --disable-static --disable-doc \
          --enable-gpl --enable-version3 --enable-libxml2 --enable-openssl --enable-libx264 --enable-zlib \
          --extra-cflags="-Werror=implicit-function-declaration -Werror=incompatible-pointer-types -Werror=int-conversion"
        make -j$(nproc) install

    - name: FATE tests of the HLS discontinuity patch
      run: |
        cd ffsrc
        export LD_LIBRARY_PATH=$HOME/ffmpeg/lib
        make -j$(nproc) fate-hls-discontinuity fate-hls-discontinuity-seek fate-hls-discontinuity-notag-live || {
          cat tests/data/fate/hls-discontinuity*.err tests/data/fate/hls-discontinuity*.diff 2>/dev/null
          exit 1
        }

    # Patch 0053: the tests generate their input with lavfi and need no
    # samples. The build above is not restricted (no --disable-everything),
    # the components the tests depend on are checked so that none of the
    # tests is silently left out.
    - name: FATE tests of the codec name in stream specifiers (patch 0053)
      run: |
        set -eux
        cd ffsrc
        export LD_LIBRARY_PATH=$HOME/ffmpeg/lib
        for c in LAVFI_INDEV SINE_FILTER ANULL_FILTER PCM_S16LE_ENCODER PCM_S16LE_DECODER \
                 PCM_ALAW_ENCODER PCM_ALAW_DECODER PCM_MULAW_ENCODER PCM_MULAW_DECODER \
                 NUT_MUXER NUT_DEMUXER NULL_MUXER FILE_PROTOCOL; do
          grep -qx "#define CONFIG_$c 1" config_components.h
        done
        grep -qx '#define CONFIG_FFPROBE 1' config.h
        make fate-list | grep '^fate-ffmpeg-spec-codec' | tee ../spec_tests.txt
        test "$(grep -c . ../spec_tests.txt)" = 6
        show() {
          for t in "" -index -compat -map -filter -type; do
            for e in "" .err .diff; do
              f=tests/data/fate/ffmpeg-spec-codec$t$e
              if [ -s $f ]; then echo "== $f"; cat $f; fi
            done
          done
        }
        make -j$(nproc) fate-ffmpeg-spec-codec-all KEEP=1 || { show; exit 1; }
        show

    - name: Build exteplayer3
      run: |
        ./autogen.sh
        PKG_CONFIG_PATH=$HOME/ffmpeg/lib/pkgconfig ./configure
        make -j$(nproc)
        LD_LIBRARY_PATH=$HOME/ffmpeg/lib ./exteplayer3 2>&1 | grep -q -- '-Q'

    - name: Build exteplayer3 of oe-alliance master
      run: |
        git clone --depth 1 https://github.com/oe-alliance/exteplayer3 upstream
        cd upstream
        ./autogen.sh
        PKG_CONFIG_PATH=$HOME/ffmpeg/lib/pkgconfig ./configure
        make -j$(nproc)

    - name: Check the patched demuxers
      env:
        LD_LIBRARY_PATH: /home/runner/ffmpeg/lib
      run: |
        set -eux
        FF=$HOME/ffmpeg/bin/ffmpeg; FP=$HOME/ffmpeg/bin/ffprobe
        mkdir t && cd t
        # HLS with WebVTT subtitles
        printf 'WEBVTT\n\n00:00:01.000 --> 00:00:03.000\nhello\n' > sub.vtt
        $FF -v error -f lavfi -i testsrc=d=6:s=160x90 -f lavfi -i sine=d=6 -i sub.vtt \
            -map 0:v -map 1:a -map 2:s -c:v libx264 -g 25 -c:a aac -c:s webvtt \
            -f hls -hls_time 2 -hls_playlist_type vod -master_pl_name master.m3u8 \
            -var_stream_map "v:0,a:0,s:0,sgroup:subs" hls_%v.m3u8
        $FP -v error -show_entries stream=codec_type -of csv=p=0 master.m3u8 | sort | tee hls.txt
        grep -q video hls.txt; grep -q audio hls.txt
        # DASH
        $FF -v error -f lavfi -i testsrc=d=6:s=160x90 -f lavfi -i sine=d=6 -c:v libx264 -g 25 -c:a aac \
            -f dash -seg_duration 2 dash.mpd
        $FP -v error -show_entries stream=codec_type -of csv=p=0 dash.mpd | sort | tee dash.txt
        grep -q video dash.txt; grep -q audio dash.txt
        $FF -v error -i dash.mpd -f null -
        # CENC encrypted MP4, decrypted by key
        K=00112233445566778899aabbccddeeff
        $FF -v error -f lavfi -i testsrc=d=3:s=160x90 -c:v libx264 -encryption_scheme cenc-aes-ctr \
            -encryption_key $K -encryption_kid 0102030405060708090a0b0c0d0e0f10 enc.mp4
        $FF -v error -decryption_key $K -i enc.mp4 -f null -

    # Patches 0051 (hls) and 0052 (dashdec): a track that the player switches
    # in during playback (AVStream.discard from ALL to DEFAULT) has to arrive,
    # and at the playing position. track_switch.c reads generated streams with
    # two audio tracks: HLS with two audio renditions, DASH with a
    # SegmentTimeline, with segments of a fixed duration (the two audio
    # representations have segments of 1 and 3 seconds, so their segment
    # numbers do not match) and DASH with single files.
    - name: Tracks switched in during playback (patches 0051 and 0052)
      env:
        LD_LIBRARY_PATH: /home/runner/ffmpeg/lib
      run: |
        set -eux
        FF=$HOME/ffmpeg/bin/ffmpeg; FP=$HOME/ffmpeg/bin/ffprobe
        gcc -O1 -Wall -Werror -o track_switch .github/ffmpeg9-tests/track_switch.c \
            $(PKG_CONFIG_PATH=$HOME/ffmpeg/lib/pkgconfig pkg-config --cflags --libs libavformat libavcodec libavutil) -lm
        mkdir -p sw/hls sw/tl sw/dur sw/sf sw/sfm && cd sw
        A="-f lavfi -i sine=f=440:d=30 -f lavfi -i sine=f=880:d=30"
        $FF -v error -f lavfi -i testsrc=d=30:s=160x90:r=25 $A -map 0:v -map 1:a -map 2:a \
            -c:v libx264 -g 25 -c:a aac -b:a 64k -f hls -hls_time 2 -hls_playlist_type vod \
            -master_pl_name master.m3u8 \
            -var_stream_map "v:0,agroup:aud a:0,agroup:aud,default:yes a:1,agroup:aud" hls/p%v.m3u8
        cat hls/master.m3u8
        AS="id=0,seg_duration=1,streams=0 id=1,seg_duration=3,streams=1"
        $FF -v error $A -map 0:a -map 1:a -c:a aac -b:a 64k -f dash -adaptation_sets "$AS" tl/a.mpd
        $FF -v error $A -map 0:a -map 1:a -c:a aac -b:a 64k -f dash -use_timeline 0 -adaptation_sets "$AS" dur/a.mpd
        cat tl/a.mpd dur/a.mpd
        $FF -v error -f lavfi -i sine=f=440:d=30 -c:a aac -b:a 64k -movflags +faststart sf/a.mp4
        $FF -v error -f lavfi -i sine=f=880:d=30 -c:a aac -b:a 64k -movflags +faststart sf/b.mp4
        {
          echo '<?xml version="1.0" encoding="utf-8"?>'
          echo '<MPD xmlns="urn:mpeg:dash:schema:mpd:2011" profiles="urn:mpeg:dash:profile:isoff-on-demand:2011" type="static" mediaPresentationDuration="PT30S" minBufferTime="PT2S">'
          echo '<Period id="0" start="PT0S">'
          for r in a b; do
            echo "<AdaptationSet id=\"$r\" contentType=\"audio\" lang=\"en\">"
            echo "<Representation id=\"$r\" mimeType=\"audio/mp4\" codecs=\"mp4a.40.2\" bandwidth=\"64000\" audioSamplingRate=\"44100\">"
            echo "<BaseURL>$r.mp4</BaseURL>"
            echo '</Representation>'
            echo '</AdaptationSet>'
          done
          echo '</Period>'
          echo '</MPD>'
        } > sf/a.mpd
        cat sf/a.mpd
        # the single file of the dash muxer: a SegmentList with byte ranges
        $FF -v error $A -map 0:a -map 1:a -c:a aac -b:a 64k -f dash -single_file 1 \
            -adaptation_sets "id=0,streams=0 id=1,streams=1" sfm/a.mpd
        cat sfm/a.mpd
        # sf: a local manifest whose representations are one file each needs
        # patch 0054 (without it the segment is opened with the http option
        # seekable=1, which the file protocol rejects)
        for n in hls tl dur sf; do
          cd $n; f=a.mpd; if [ $n = hls ]; then f=master.m3u8; fi
          $FP -v error -show_entries stream=index,codec_type -of csv=p=0 $f || {
            $FP -v debug $f 2>&1 | tail -80
            exit 1
          }
          ../../track_switch $f 6 near 0.5
          cd ..
        done
        python3 ../.github/ffmpeg9-tests/range_server.py 8089 &
        sleep 1
        H=http://127.0.0.1:8089
        # not gating: a failure of this check is shown as a warning
        ../track_switch $H/sf/a.mpd 6 near 0.5 ||
          echo "::warning::single-file DASH over HTTP: the track switch check failed"
        # patch 0054: the local single files give the same packets as over
        # HTTP, read through and with a seek
        rd()   { $FF -nostdin -v error -flags +bitexact "$@" -map 0 -c copy -fflags +bitexact -f framecrc -; }
        seek() { $FF -nostdin -v error -flags +bitexact -ss 7.3 "$@" -map 0 -t 4 -c copy -fflags +bitexact -f framecrc -; }
        rd   -i sf/a.mpd    > sf_all_local.txt
        seek -i sf/a.mpd    > sf_seek_local.txt
        rd   -i $H/sf/a.mpd > sf_all_http.txt
        seek -i $H/sf/a.mpd > sf_seek_http.txt
        wc -l sf_all_local.txt sf_seek_local.txt
        test "$(grep -vc '^#' sf_all_local.txt)" -gt 100
        test "$(grep -vc '^#' sf_seek_local.txt)" -gt 100
        diff -u sf_all_http.txt sf_all_local.txt
        diff -u sf_seek_http.txt sf_seek_local.txt
        # Byte range segments (the single file of the dash muxer): over HTTP
        # they are requested with offset/end_offset. The file protocol has no
        # such options, FFmpeg 9.0.2 does not support them for a local file
        # either. Information only.
        if rd -i $H/sfm/a.mpd > sfm_all_http.txt 2> sfm_http.err; then
          echo "::notice::single file of the dash muxer over HTTP: $(grep -vc '^#' sfm_all_http.txt) packets"
        else
          tail -5 sfm_http.err
          echo "::warning::single file of the dash muxer over HTTP: not readable"
        fi
        if rd -i sfm/a.mpd > sfm_all_local.txt 2> sfm_local.err && cmp -s sfm_all_http.txt sfm_all_local.txt; then
          echo "::notice::single file of the dash muxer, local: the same packets as over HTTP"
        else
          tail -5 sfm_local.err
          echo "::notice::single file of the dash muxer, local: $(grep -vc '^#' sfm_all_local.txt) packets, not the same as over HTTP (byte ranges of a local file are not supported)"
        fi
        kill $! || true

    # What FFmpeg 9.0.2 without any patch does with the local single-file
    # manifests of the step above (demuxers only, built from the same
    # tarball). Information only, nothing here is gating.
    - name: Local single-file DASH in FFmpeg 9.0.2 without patches (information)
      run: |
        set +e -ux
        mkdir ffvan && tar -xf ffsrc/ff.tar.xz --strip-components=1 -C ffvan
        cd ffvan
        ./configure --disable-everything --disable-autodetect --disable-doc --disable-ffplay --disable-ffprobe \
          --enable-libxml2 --enable-demuxer=dash,mov --enable-protocol=file --enable-muxer=framecrc \
          --enable-decoder=aac --enable-parser=aac > /dev/null &&
        make -j$(nproc) ffmpeg > /dev/null || { echo "::warning::FFmpeg 9.0.2 without patches did not build"; exit 0; }
        cd ../sw
        for n in sf sfm; do
          ../ffvan/ffmpeg -nostdin -v error -flags +bitexact -i $n/a.mpd -map 0 -c copy -fflags +bitexact \
              -f framecrc - > ${n}_all_vanilla.txt 2> ${n}_vanilla.err
          rc=$?
          tail -5 ${n}_vanilla.err
          same=differ
          if cmp -s ${n}_all_vanilla.txt ${n}_all_local.txt; then same="are the same"; fi
          diff -u ${n}_all_vanilla.txt ${n}_all_local.txt | head -40
          echo "::notice::FFmpeg 9.0.2 without patches, local $n/a.mpd: exit $rc, $(grep -vc '^#' ${n}_all_vanilla.txt) packets, $(grep -c . ${n}_vanilla.err) lines of errors; the packets of the patched build $same"
        done
        exit 0

    # Patch 0053 must not change what the ffmpeg tool does with the stream
    # specifier forms that existed before: the build tree gets ffmpeg
    # without 0053 (fftools only, the libraries are not touched), both run
    # the same commands on a file with three audio streams (pcm_s16le eng,
    # pcm_alaw deu, pcm_s16le fra) and must write the same file.
    - name: ffmpeg with the old stream specifier forms unchanged by patch 0053
      env:
        LD_LIBRARY_PATH: /home/runner/ffmpeg/lib
      run: |
        set -eux
        NEW=$HOME/ffmpeg/bin/ffmpeg; FP=$HOME/ffmpeg/bin/ffprobe
        cd ffsrc
        patch -R -p1 --no-backup-if-mismatch -s < ../ffmpeg-patches/0053-*.patch
        test "$(grep -c stream_specifier_codec fftools/cmdutils.c || true)" = 0
        make -j$(nproc) ffmpeg
        cp ffmpeg ../ffmpeg_old
        patch -p1 --no-backup-if-mismatch -s < ../ffmpeg-patches/0053-*.patch
        make -j$(nproc) ffmpeg
        OLD=$PWD/../ffmpeg_old
        mkdir ../spec && cd ../spec
        $NEW -nostdin -v error -f lavfi -i sine=1000:d=0.5 -f lavfi -i sine=2000:d=0.5 -f lavfi -i sine=3000:d=0.5 \
            -map 0 -map 1 -map 2 -c:a pcm_s16le -c:a:1 pcm_alaw \
            -metadata:s:a:0 language=eng -metadata:s:a:1 language=deu -metadata:s:a:2 language=fra \
            -disposition:a 0 -disposition:a:1 default -bitexact in.mkv
        list() { $FP -v error -show_entries stream=index,codec_name:stream_disposition=default:stream_tags=language -of compact=p=0:nk=1 "$1"; }
        list in.mkv
        i=0
        while IFS= read -r args; do
          i=$((i+1))
          for b in OLD NEW; do
            ${!b} -nostdin -v error -i in.mkv $args -bitexact -y ${b}_$i.mkv
            list ${b}_$i.mkv > ${b}_$i.txt
          done
          echo "== $i: $args"
          cat NEW_$i.txt
          diff -u OLD_$i.txt NEW_$i.txt
          cmp OLD_$i.mkv NEW_$i.mkv
        done <<'EOF'
        -map 0 -c copy -c:a:1 pcm_mulaw
        -map 0:a:1 -c copy
        -map 0:a:m:language:fra -c copy
        -map 0 -c copy -disposition:a:0 default
        -map 0 -c copy -c:a:m:language:deu pcm_mulaw -metadata:s:a:2 title=x
        -map 0:a -map -0:a:0 -c:a pcm_mulaw -c:a:0 copy
        EOF
        test $i = 6
        # the commands select what they say
        test "$(grep -c pcm_mulaw NEW_1.txt)" = 1
        sed -n 2p NEW_1.txt | grep -q pcm_mulaw
        test "$(grep -c . NEW_2.txt)" = 1
        grep -q pcm_alaw NEW_2.txt
        test "$(grep -c . NEW_3.txt)" = 1
        grep -q fra NEW_3.txt
        test "$(grep -c . NEW_4.txt)" = 3
        sed -n 2p NEW_5.txt | grep -q pcm_mulaw
        # and ffmpeg without the patch does not know the codec form
        if $OLD -nostdin -v error -i in.mkv -map 0 -c copy -c:a:pcm_alaw pcm_mulaw -bitexact -y old_codec.mkv; then
          echo "ffmpeg without patch 0053 accepted -c:a:pcm_alaw"; exit 1
        fi
        $NEW -nostdin -v error -i in.mkv -map 0 -c copy -c:a:pcm_alaw pcm_mulaw -bitexact -y new_codec.mkv
        list new_codec.mkv | tee new_codec.txt
        test "$(grep -c pcm_mulaw new_codec.txt)" = 1
        sed -n 2p new_codec.txt | grep -q pcm_mulaw

    # The patches 0050, 0051 and 0052 must not change anything for a caller
    # that does not switch tracks (and 0050 nothing for HLS without
    # #EXT-X-DISCONTINUITY): the build tree gets libavformat without 0052,
    # 0051 and the hls.c part of 0050 (the installed one keeps them), both
    # read the same streams and must give the same output. The demuxers
    # without the patches also show that track_switch tests something: HLS
    # never delivers the track that is switched in (OE-A patch 0008), DASH
    # starts it somewhere else. Runs last, the tree is not installed again.
    - name: HLS and DASH unchanged by the patches 0050 to 0052 without a track switch
      run: |
        set -eux
        cd ffsrc
        FFS=$PWD
        awk '/^diff --git /{p = ($0 ~ /^diff --git a\/libavformat\/hls\.c /)} p' \
            ../ffmpeg-patches/0050-*.patch > ../hls0050.diff
        test -s ../hls0050.diff
        patch -R -p1 --no-backup-if-mismatch -s < ../ffmpeg-patches/0052-*.patch
        patch -R -p1 --no-backup-if-mismatch -s < ../ffmpeg-patches/0051-*.patch
        patch -R -p1 --no-backup-if-mismatch -s < ../hls0050.diff
        grep -A3 'if (c->first_packet) {' libavformat/hls.c
        make -j$(nproc)
        REF=$PWD/libavutil:$PWD/libavcodec:$PWD/libavformat:$PWD/libavdevice:$PWD/libavfilter:$PWD/libswscale:$PWD/libswresample
        NEW=$HOME/ffmpeg/lib
        reflib=$(LD_LIBRARY_PATH=$REF ldd ./ffmpeg | awk '/libavformat/ {print $3}')
        newlib=$(LD_LIBRARY_PATH=$NEW ldd ./ffmpeg | awk '/libavformat/ {print $3}')
        echo "unpatched: $reflib  patched: $newlib"
        test "$(grep -c 'Timeline anchor' "$reflib" || true)" = 0
        test "$(grep -c 'Timeline anchor' "$newlib")" -gt 0
        # FATE test of a tag-less live playlist: both demuxers against the reference
        # (generated by the unpatched one if the patch does not ship it yet)
        T=fate-hls-discontinuity-notag-live
        if [ ! -f tests/ref/fate/hls-discontinuity-notag-live ]; then
          LD_LIBRARY_PATH=$REF make $T GEN=1 || true
        fi
        cat tests/ref/fate/hls-discontinuity-notag-live
        LD_LIBRARY_PATH=$REF make $T
        LD_LIBRARY_PATH=$NEW make $T
        # the same segments as VOD, read through and with a seek
        sed '$a #EXT-X-ENDLIST' tests/data/hls_notag_live.m3u8 > tests/data/hls_notag_vod.m3u8
        cat tests/data/hls_notag_vod.m3u8
        for lib in REF NEW; do
          export LD_LIBRARY_PATH=${!lib}
          ./ffmpeg -nostdin -v error -flags +bitexact -i tests/data/hls_notag_vod.m3u8 \
              -c copy -fflags +bitexact -f framecrc - > ../vod_$lib.txt
          ./ffmpeg -nostdin -v error -flags +bitexact -ss 1.2 -i tests/data/hls_notag_vod.m3u8 \
              -t 1 -c copy -fflags +bitexact -f framecrc - > ../vodseek_$lib.txt
          ./ffmpeg -nostdin -v error -flags +bitexact -live_start_index -2 -max_reload 1 \
              -i tests/data/hls_notag_live.m3u8 -c copy -fflags +bitexact -f framecrc - > ../liveedge_$lib.txt
        done
        # the streams of the track switch check, without a switch: read
        # through, with a seek, and one track only (ffmpeg discards the others)
        for lib in REF NEW; do
          export LD_LIBRARY_PATH=${!lib}
          for n in hls tl dur; do
            cd ../sw/$n
            m=a.mpd; if [ $n = hls ]; then m=master.m3u8; fi
            $FFS/ffmpeg -nostdin -v error -flags +bitexact -i $m -map 0 \
                -c copy -fflags +bitexact -f framecrc - > $FFS/../sw_${n}_all_$lib.txt
            $FFS/ffmpeg -nostdin -v error -flags +bitexact -ss 7.3 -i $m -map 0 \
                -t 4 -c copy -fflags +bitexact -f framecrc - > $FFS/../sw_${n}_seek_$lib.txt
            $FFS/ffmpeg -nostdin -v error -flags +bitexact -i $m -map 0:a:1 \
                -c copy -fflags +bitexact -f framecrc - > $FFS/../sw_${n}_one_$lib.txt
            cd $FFS
          done
        done
        # without the patches the track that is switched in does not arrive
        # (HLS) or not at the playing position (DASH)
        export LD_LIBRARY_PATH=$REF
        (cd ../sw/hls && ../../track_switch master.m3u8 6 none 0.5)
        for n in tl dur; do
          (cd ../sw/$n && ../../track_switch a.mpd 6 far 0.5)
        done
        unset LD_LIBRARY_PATH
        for t in vod vodseek liveedge; do
          cat ../${t}_NEW.txt
          diff -u ../${t}_REF.txt ../${t}_NEW.txt
        done
        for n in hls tl dur; do
          for t in all seek one; do
            wc -l ../sw_${n}_${t}_NEW.txt
            test "$(grep -vc '^#' ../sw_${n}_${t}_NEW.txt)" -gt 100
            diff -u ../sw_${n}_${t}_REF.txt ../sw_${n}_${t}_NEW.txt
          done
        done
        # single-file DASH over HTTP, not gating (see the step above)
        (cd ../sw && exec python3 ../.github/ffmpeg9-tests/range_server.py 8089) 2>/dev/null &
        sleep 1
        U=http://127.0.0.1:8089/sf/a.mpd
        single_file() {
          for lib in REF NEW; do
            LD_LIBRARY_PATH=${!lib} ./ffmpeg -nostdin -v error -flags +bitexact -i $U -map 0                 -c copy -fflags +bitexact -f framecrc - > ../sw_sf_all_$lib.txt &&
            LD_LIBRARY_PATH=${!lib} ./ffmpeg -nostdin -v error -flags +bitexact -ss 7.3 -i $U -map 0                 -t 4 -c copy -fflags +bitexact -f framecrc - > ../sw_sf_seek_$lib.txt || return 1
          done
          wc -l ../sw_sf_all_NEW.txt ../sw_sf_seek_NEW.txt &&
          test "$(grep -vc '^#' ../sw_sf_all_NEW.txt)" -gt 100 &&
          test "$(grep -vc '^#' ../sw_sf_seek_NEW.txt)" -gt 100 &&
          diff -u ../sw_sf_all_REF.txt ../sw_sf_all_NEW.txt &&
          diff -u ../sw_sf_seek_REF.txt ../sw_sf_seek_NEW.txt &&
          LD_LIBRARY_PATH=$REF ../track_switch $U 6 far 0.5
        }
        single_file || echo "::warning::single-file DASH: the comparison without the patches failed"
        kill $! || true
