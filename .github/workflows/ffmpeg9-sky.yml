name: FFmpeg 9 patch series on release/9.0-patched

# Builds the patch series as a git branch: Masta2002/FFmpeg
# ci/sky-9.0-patched = skyjet18/FFmpeg release/9.0-patched (upstream
# release/9.0, d838f9f9ae) + 51 commits (OE-A's FFmpeg 9 patches plus the
# ffmpeg-ext ones ported to 9). Then exteplayer3 against it, and small
# checks of the patched demuxers; the tree without the series is
# release/9.0-patched itself.
# .github/ffmpeg9-tests/ffmpeg-commit holds the commit of the branch that
# is tested: a new state of the series is a new commit here.

on:
  push:
    paths:
      - '.github/ffmpeg9-tests/**'
      - '.github/workflows/ffmpeg9-sky.yml'
  workflow_dispatch:

env:
  FF_BASE: d838f9f9aeb0e09b4d068e2af20a46a12640696f

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v4

    - name: Commit of the series
      id: pin
      run: echo "sha=$(cat .github/ffmpeg9-tests/ffmpeg-commit)" >> "$GITHUB_OUTPUT"

    - name: Patched tree (Masta2002/FFmpeg ci/sky-9.0-patched)
      uses: actions/checkout@v4
      with:
        repository: Masta2002/FFmpeg
        ref: ci/sky-9.0-patched
        path: ffsrc
        fetch-depth: 60

    - name: Tree without the series (skyjet18/FFmpeg release/9.0-patched)
      uses: actions/checkout@v4
      with:
        repository: skyjet18/FFmpeg
        ref: d838f9f9aeb0e09b4d068e2af20a46a12640696f
        path: ffvan

    # Every test command runs under a time limit: a demuxer that does not
    # come back is a failure with a message, not a job that hangs for hours.
    # usage: tmo command ...   (TMO=<seconds>, default 120)
    - name: Time limit for the test commands
      run: |
        mkdir -p $HOME/bin
        cat > $HOME/bin/tmo <<'EOF'
        #!/bin/sh
        timeout -k 10 "${TMO:-120}" "$@"
        rc=$?
        if [ $rc -eq 124 ] || [ $rc -eq 137 ]; then
          echo "::error::TIMEOUT after ${TMO:-120} s: $*" >&2
        fi
        exit $rc
        EOF
        chmod +x $HOME/bin/tmo
        echo "$HOME/bin" >> $GITHUB_PATH

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential pkg-config autoconf automake libtool nasm \
          libxml2-dev libssl-dev libbluray-dev librtmp-dev libudfread-dev \
          zlib1g-dev libbz2-dev liblzma-dev libx264-dev

    # The branch is the pinned commit and is the base plus 51 commits. The
    # later steps take single commits out of the build tree again: their
    # diffs are written to ffpatches/ under the numbers the patch files had.
    - name: The series
      run: |
        set -eux
        cd ffsrc
        test "$(git rev-parse HEAD)" = "${{ steps.pin.outputs.sha }}"
        test "$(git -C ../ffvan rev-parse HEAD)" = $FF_BASE
        test "$(git rev-parse HEAD~51)" = $FF_BASE
        test "$(git rev-list --count $FF_BASE..HEAD)" = 51
        git log --format='%h %an: %s' $FF_BASE..HEAD
        git diff --stat $FF_BASE HEAD | tail -1
        # no line of the series ends in a carriage return
        test "$(git diff $FF_BASE HEAD | grep -c $'^+.*\r$' || true)" = 0
        mkdir ../ffpatches
        one() {
          c=$(git log --format='%H %s' $FF_BASE..HEAD | awk -v s="$2" 'substr($0, 42) == s { print $1 }')
          test "$(echo "$c" | wc -w)" = 1
          git diff $c~ $c > ../ffpatches/$1.diff
          test -s ../ffpatches/$1.diff
        }
        one 0050 'hls: added support for #EXT-X-DISCONTINUITY'
        one 0051 'avformat/hls: recheck the discard flags during playback and reset a playlist that is switched in'
        one 0052 'avformat/dashdec: align a representation switched in during playback by media time'
        one 0053 'fftools/ffmpeg: stream specifiers can select streams by codec'
        one 0054 'avformat/dashdec: the http options of a segment only for http urls'
        wc -l ../ffpatches/*.diff

    - name: Build FFmpeg
      run: |
        cd ffsrc
        ./configure --prefix=$HOME/ffmpeg --enable-shared --disable-static --disable-doc \
          --enable-gpl --enable-version3 --enable-libxml2 --enable-openssl --enable-libx264 --enable-zlib \
          --extra-cflags="-Werror=implicit-function-declaration -Werror=incompatible-pointer-types -Werror=int-conversion"
        make -j$(nproc) install

    - name: FATE tests of the HLS discontinuity patch
      run: |
        cd ffsrc
        export LD_LIBRARY_PATH=$HOME/ffmpeg/lib
        TMO=900 tmo make -j$(nproc) fate-hls-discontinuity fate-hls-discontinuity-seek fate-hls-discontinuity-notag-live || {
          cat tests/data/fate/hls-discontinuity*.err tests/data/fate/hls-discontinuity*.diff 2>/dev/null
          exit 1
        }

    # Upstream 9a9b70bb8c pinned the encoder of the HLS seek fixture to one
    # thread, its packets depended on the number of CPUs. The fixtures of
    # the discontinuity tests use the same encoder: generate them on one
    # CPU and on all and compare. Information, not gating; the fixtures
    # are generated again as before afterwards.
    - name: Fixtures of the discontinuity tests and the number of CPUs (information)
      run: |
        set +e -ux
        cd ffsrc
        export LD_LIBRARY_PATH=$HOME/ffmpeg/lib
        T="fate-hls-discontinuity fate-hls-discontinuity-seek fate-hls-discontinuity-notag-live"
        fix() { rm -f tests/data/hls_discontinuity* tests/data/hls_notag_live*; }
        sums() { (cd tests/data && md5sum hls_discontinuity_*.ts hls_notag_live_*.ts) > ../fix_$1.txt; cat ../fix_$1.txt; }
        nproc
        sums all
        fix
        TMO=600 tmo taskset -c 0 make $T
        echo "::notice::discontinuity FATE tests with fixtures generated on one CPU: exit $?"
        sums one
        if cmp -s ../fix_all.txt ../fix_one.txt; then
          echo "::notice::fixtures of the discontinuity tests: the same files on one CPU and on $(nproc)"
        else
          echo "::warning::fixtures of the discontinuity tests differ between one CPU and $(nproc)"
        fi
        # with the encoder pinned to one thread
        sed -i 's/-c:v mpeg2video -g 1/-c:v mpeg2video -threads:v 1 -g 1/' tests/fate/hlsenc.mak
        test "$(grep -c 'mpeg2video -threads:v 1 -g 1' tests/fate/hlsenc.mak)" = 3
        fix
        TMO=600 tmo make $T
        echo "::notice::discontinuity FATE tests with -threads:v 1 in the fixtures and the references as they are: exit $?"
        sums pinned
        cmp -s ../fix_all.txt ../fix_pinned.txt && echo "::notice::-threads:v 1 gives the same fixtures as $(nproc) CPUs"
        cmp -s ../fix_one.txt ../fix_pinned.txt && echo "::notice::-threads:v 1 gives the same fixtures as one CPU"
        git checkout -- tests/fate/hlsenc.mak
        fix
        TMO=600 tmo make $T || exit 1
        sums again
        cmp ../fix_all.txt ../fix_again.txt ||
          echo "::warning::fixtures of the discontinuity tests: two runs on $(nproc) CPUs gave different files"
        exit 0

    # Patch 0053: the tests generate their input with lavfi and need no
    # samples. The build above is not restricted (no --disable-everything),
    # the components the tests depend on are checked so that none of the
    # tests is silently left out.
    - name: FATE tests of the codec name in stream specifiers (patch 0053)
      run: |
        set -eux
        cd ffsrc
        export LD_LIBRARY_PATH=$HOME/ffmpeg/lib
        for c in LAVFI_INDEV SINE_FILTER ANULL_FILTER PCM_S16LE_ENCODER PCM_S16LE_DECODER \
                 PCM_ALAW_ENCODER PCM_ALAW_DECODER PCM_MULAW_ENCODER PCM_MULAW_DECODER \
                 NUT_MUXER NUT_DEMUXER NULL_MUXER FILE_PROTOCOL; do
          grep -qx "#define CONFIG_$c 1" config_components.h
        done
        grep -qx '#define CONFIG_FFPROBE 1' config.h
        make fate-list | grep '^fate-ffmpeg-spec-codec' | tee ../spec_tests.txt
        test "$(grep -c . ../spec_tests.txt)" = 6
        show() {
          for t in "" -index -compat -map -filter -type; do
            for e in "" .err .diff; do
              f=tests/data/fate/ffmpeg-spec-codec$t$e
              if [ -s $f ]; then echo "== $f"; cat $f; fi
            done
          done
        }
        TMO=900 tmo make -j$(nproc) fate-ffmpeg-spec-codec-all KEEP=1 || { show; exit 1; }
        show

    - name: Build exteplayer3
      run: |
        ./autogen.sh
        PKG_CONFIG_PATH=$HOME/ffmpeg/lib/pkgconfig ./configure
        make -j$(nproc)
        LD_LIBRARY_PATH=$HOME/ffmpeg/lib tmo ./exteplayer3 2>&1 | grep -q -- '-Q'

    - name: Build exteplayer3 of oe-alliance master
      run: |
        git clone --depth 1 https://github.com/oe-alliance/exteplayer3 upstream
        cd upstream
        git log -1 --format='%H %ad %s'
        ./autogen.sh
        PKG_CONFIG_PATH=$HOME/ffmpeg/lib/pkgconfig ./configure
        make -j$(nproc)

    # skyjet18/exteplayer3 has no build system of its own: the sources of
    # its tests/build.sh (host build, output to files), against the
    # installed shared libraries. The job exteplayer3-skyjet below runs
    # tests/build.sh itself against a static build of the series.
    - name: Build exteplayer3 of skyjet18 master
      run: |
        set -eux
        git clone --depth 1 https://github.com/skyjet18/exteplayer3 skyjet
        cd skyjet
        git log -1 --format='%H %ad %s'
        grep -n 'EPLAYER3_EXTENDED.*version' main/exteplayer.c
        gcc -O2 -Werror=implicit-function-declaration -Werror=incompatible-pointer-types -Werror=int-conversion \
            -D_FILE_OFFSET_BITS=64 -D_LARGEFILE64_SOURCE -D_LARGEFILE_SOURCE -DHAVE_FLV2MPEG4_CONVERTER \
            -DEXTEPLAYER_FAKE_VIDEO='"/dev/null"' -DEXTEPLAYER_FAKE_AUDIO='"/dev/null"' -DEXTEPLAYER_TERM_SOCKET='""' \
            -Wno-deprecated-declarations -Iinclude -Iexternal -Iexternal/flv2mpeg4 \
            $(PKG_CONFIG_PATH=$HOME/ffmpeg/lib/pkgconfig pkg-config --cflags libavformat libavcodec libswresample libswscale libavutil) \
            main/exteplayer.c tools/debug.c tools/strbuffer.c tools/pcm_export.c \
            container/container.c container/container_ffmpeg.c \
            manager/manager.c manager/audio.c manager/video.c manager/subtitle.c \
            playback/playback.c output/output.c output/output_subtitle.c output/graphic_subtitle.c \
            output/linuxdvb_fake.c output/linuxdvb_buffering.c \
            output/writer/common/pes.c output/writer/common/misc.c output/writer/common/writer.c \
            output/writer/mipsel/*.c external/ffmpeg/src/bitstream.c \
            external/ffmpeg/src/latmenc.c external/ffmpeg/src/mpeg4audio.c \
            external/flv2mpeg4/src/*.c external/plugins/src/png.c \
            $(PKG_CONFIG_PATH=$HOME/ffmpeg/lib/pkgconfig pkg-config --libs libavformat libavcodec libswresample libswscale libavutil) \
            -pthread -lm -ldl -o exteplayer3
        LD_LIBRARY_PATH=$HOME/ffmpeg/lib ldd ./exteplayer3 | grep -E 'libav|libsw'
        LD_LIBRARY_PATH=$HOME/ffmpeg/lib tmo ./exteplayer3 2>&1 | head -5 || true

    - name: Check the patched demuxers
      env:
        LD_LIBRARY_PATH: /home/runner/ffmpeg/lib
      run: |
        set -eux
        FF="tmo $HOME/ffmpeg/bin/ffmpeg"; FP="tmo $HOME/ffmpeg/bin/ffprobe"
        mkdir t && cd t
        # HLS with WebVTT subtitles
        printf 'WEBVTT\n\n00:00:01.000 --> 00:00:03.000\nhello\n' > sub.vtt
        $FF -v error -f lavfi -i testsrc=d=6:s=160x90 -f lavfi -i sine=d=6 -i sub.vtt \
            -map 0:v -map 1:a -map 2:s -c:v libx264 -g 25 -c:a aac -c:s webvtt \
            -f hls -hls_time 2 -hls_playlist_type vod -master_pl_name master.m3u8 \
            -var_stream_map "v:0,a:0,s:0,sgroup:subs" hls_%v.m3u8
        $FP -v error -show_entries stream=codec_type -of csv=p=0 master.m3u8 | sort | tee hls.txt
        grep -q video hls.txt; grep -q audio hls.txt
        # DASH
        $FF -v error -f lavfi -i testsrc=d=6:s=160x90 -f lavfi -i sine=d=6 -c:v libx264 -g 25 -c:a aac \
            -f dash -seg_duration 2 dash.mpd
        $FP -v error -show_entries stream=codec_type -of csv=p=0 dash.mpd | sort | tee dash.txt
        grep -q video dash.txt; grep -q audio dash.txt
        $FF -v error -i dash.mpd -f null -
        # CENC encrypted MP4, decrypted by key
        K=00112233445566778899aabbccddeeff
        $FF -v error -f lavfi -i testsrc=d=3:s=160x90 -c:v libx264 -encryption_scheme cenc-aes-ctr \
            -encryption_key $K -encryption_kid 0102030405060708090a0b0c0d0e0f10 enc.mp4
        $FF -v error -decryption_key $K -i enc.mp4 -f null -

    # Patches 0051 (hls) and 0052 (dashdec): a track that the player switches
    # in during playback (AVStream.discard from ALL to DEFAULT) has to arrive,
    # and at the playing position. track_switch.c reads generated streams with
    # two audio tracks: HLS with two audio renditions, DASH with a
    # SegmentTimeline, with segments of a fixed duration (the two audio
    # representations have segments of 1 and 3 seconds, so their segment
    # numbers do not match) and DASH with single files.
    - name: Tracks switched in during playback (patches 0051 and 0052)
      env:
        LD_LIBRARY_PATH: /home/runner/ffmpeg/lib
      run: |
        set -eux
        FF="tmo $HOME/ffmpeg/bin/ffmpeg"; FP="tmo $HOME/ffmpeg/bin/ffprobe"
        gcc -O1 -Wall -Werror -o track_switch .github/ffmpeg9-tests/track_switch.c \
            $(PKG_CONFIG_PATH=$HOME/ffmpeg/lib/pkgconfig pkg-config --cflags --libs libavformat libavcodec libavutil) -lm
        mkdir -p sw/hls sw/tl sw/dur sw/sf sw/sfm && cd sw
        A="-f lavfi -i sine=f=440:d=30 -f lavfi -i sine=f=880:d=30"
        $FF -v error -f lavfi -i testsrc=d=30:s=160x90:r=25 $A -map 0:v -map 1:a -map 2:a \
            -c:v libx264 -g 25 -c:a aac -b:a 64k -f hls -hls_time 2 -hls_playlist_type vod \
            -master_pl_name master.m3u8 \
            -var_stream_map "v:0,agroup:aud a:0,agroup:aud,default:yes a:1,agroup:aud" hls/p%v.m3u8
        cat hls/master.m3u8
        AS="id=0,seg_duration=1,streams=0 id=1,seg_duration=3,streams=1"
        $FF -v error $A -map 0:a -map 1:a -c:a aac -b:a 64k -f dash -adaptation_sets "$AS" tl/a.mpd
        $FF -v error $A -map 0:a -map 1:a -c:a aac -b:a 64k -f dash -use_timeline 0 -adaptation_sets "$AS" dur/a.mpd
        cat tl/a.mpd dur/a.mpd
        $FF -v error -f lavfi -i sine=f=440:d=30 -c:a aac -b:a 64k -movflags +faststart sf/a.mp4
        $FF -v error -f lavfi -i sine=f=880:d=30 -c:a aac -b:a 64k -movflags +faststart sf/b.mp4
        {
          echo '<?xml version="1.0" encoding="utf-8"?>'
          echo '<MPD xmlns="urn:mpeg:dash:schema:mpd:2011" profiles="urn:mpeg:dash:profile:isoff-on-demand:2011" type="static" mediaPresentationDuration="PT30S" minBufferTime="PT2S">'
          echo '<Period id="0" start="PT0S">'
          for r in a b; do
            echo "<AdaptationSet id=\"$r\" contentType=\"audio\" lang=\"en\">"
            echo "<Representation id=\"$r\" mimeType=\"audio/mp4\" codecs=\"mp4a.40.2\" bandwidth=\"64000\" audioSamplingRate=\"44100\">"
            echo "<BaseURL>$r.mp4</BaseURL>"
            echo '</Representation>'
            echo '</AdaptationSet>'
          done
          echo '</Period>'
          echo '</MPD>'
        } > sf/a.mpd
        cat sf/a.mpd
        # the single file of the dash muxer: a SegmentList with byte ranges
        $FF -v error $A -map 0:a -map 1:a -c:a aac -b:a 64k -f dash -single_file 1 \
            -adaptation_sets "id=0,streams=0 id=1,streams=1" sfm/a.mpd
        cat sfm/a.mpd
        # the same with media ranges that end 500 bytes too early: the
        # samples at the end of every segment are not in its range
        awk '{ if (match($0, /mediaRange="[0-9]+-[0-9]+"/)) {
                 split(substr($0, RSTART + 12, RLENGTH - 13), a, "-")
                 $0 = substr($0, 1, RSTART - 1) "mediaRange=\"" a[1] "-" (a[2] - 500) "\"" substr($0, RSTART + RLENGTH)
               }
               print }' sfm/a.mpd > sfm/short.mpd
        diff sfm/a.mpd sfm/short.mpd | head -6 || true
        test "$(grep -c mediaRange sfm/short.mpd)" = 12
        test "$(diff sfm/a.mpd sfm/short.mpd | grep -c '^>')" = 12
        # sf: a local manifest whose representations are one file each needs
        # patch 0054 (without it the segment is opened with the http option
        # seekable=1, which the file protocol rejects)
        for n in hls tl dur sf sfm; do
          cd $n; f=a.mpd; if [ $n = hls ]; then f=master.m3u8; fi
          $FP -v error -show_entries stream=index,codec_type -of csv=p=0 $f || {
            $FP -v debug $f 2>&1 | tail -80
            exit 1
          }
          if [ $n != sfm ]; then tmo ../../track_switch $f 6 near 0.5; fi
          cd ..
        done
        python3 ../.github/ffmpeg9-tests/range_server.py 8089 &
        SRV=$!
        trap 'kill $SRV 2>/dev/null || true' EXIT
        sleep 1
        H=http://127.0.0.1:8089
        # not gating: a failure of these checks is shown as a warning
        tmo ../track_switch $H/sf/a.mpd 6 near 0.5 ||
          echo "::warning::single-file DASH over HTTP: the track switch check failed"
        (cd sfm && tmo ../../track_switch a.mpd 6 near 0.5) ||
          echo "::warning::local byte range DASH: the track switch check failed"
        # Patch 0054: local manifests give the same packets as over HTTP,
        # read through and with a seek. sf: one file per representation.
        # sfm: byte range segments (the single file of the dash muxer).
        # sfm/short: ranges that are too short - whatever comes out, the
        # demuxer has to come back (it did not: the job ran into its limit).
        rd()   { $FF -nostdin -v error -flags +bitexact "$@" -map 0 -c copy -fflags +bitexact -f framecrc -; }
        seek() { $FF -nostdin -v error -flags +bitexact -ss 7.3 "$@" -map 0 -t 4 -c copy -fflags +bitexact -f framecrc -; }
        hung=0
        for n in sf/a sfm/a sfm/short; do
          for w in local http; do
            u=$n.mpd; if [ $w = http ]; then u=$H/$u; fi
            k=$(echo $n | tr / _)_$w
            for t in all seek; do
              rc=0
              if [ $t = all ]; then
                rd -i $u > pat_${k}_$t.txt 2> pat_${k}_$t.err || rc=$?
              else
                seek -i $u > pat_${k}_$t.txt 2> pat_${k}_$t.err || rc=$?
              fi
              tail -3 pat_${k}_$t.err
              echo "$k $t $rc" >> pat_rc.txt
              if [ $rc = 124 ] || [ $rc = 137 ]; then hung=1; fi
              echo "::notice::patched build, $w $n.mpd ($t): exit $rc, $(grep -vc '^#' pat_${k}_$t.txt) packets, $(grep -c . pat_${k}_$t.err) lines of errors"
            done
          done
        done
        cat pat_rc.txt
        test $hung = 0
        for k in sf_a sfm_a; do
          for w in local http; do
            grep -qx "${k}_$w all 0" pat_rc.txt
            grep -qx "${k}_$w seek 0" pat_rc.txt
          done
          test "$(grep -vc '^#' pat_${k}_local_all.txt)" -gt 100
          test "$(grep -vc '^#' pat_${k}_local_seek.txt)" -gt 0
          diff -u pat_${k}_http_all.txt pat_${k}_local_all.txt
          diff -u pat_${k}_http_seek.txt pat_${k}_local_seek.txt
        done
        test "$(grep -vc '^#' pat_sf_a_local_seek.txt)" -gt 100
        if cmp -s pat_sfm_short_http_all.txt pat_sfm_short_local_all.txt; then
          echo "::notice::patched build, sfm/short.mpd: the same packets local and over HTTP"
        else
          echo "::warning::patched build, sfm/short.mpd: local and HTTP differ"
        fi

    # What release/9.0-patched without the series (d838f9f9ae) does with the
    # manifests of the step above, local and over HTTP (demuxers only; the
    # HLS and MPEG-TS ones are for the byte range step at the end).
    # Information only, nothing here is gating; a command that does not
    # come back is ended after 60 seconds.
    - name: Single-file DASH in FFmpeg 9.0 without the series (information)
      run: |
        set +e -ux
        cd ffvan
        ./configure --disable-everything --disable-autodetect --disable-doc --disable-ffplay --disable-ffprobe \
          --enable-libxml2 --enable-demuxer=dash,mov,hls,mpegts --enable-protocol=file,http,tcp,pipe --enable-muxer=framecrc \
          --enable-decoder=aac,mpeg2video,h264 --enable-parser=aac,mpegvideo,mpegaudio,h264 > /dev/null &&
        make -j$(nproc) ffmpeg > /dev/null || { echo "::warning::FFmpeg 9.0 without the series did not build"; exit 0; }
        cd ../sw
        python3 ../.github/ffmpeg9-tests/range_server.py 8089 &
        SRV=$!
        trap 'kill $SRV 2>/dev/null || true' EXIT
        sleep 1
        H=http://127.0.0.1:8089
        for n in sf/a sfm/a sfm/short; do
          for w in local http; do
            u=$n.mpd; if [ $w = http ]; then u=$H/$u; fi
            k=$(echo $n | tr / _)_$w
            timeout -k 5 60 ../ffvan/ffmpeg -nostdin -v error -flags +bitexact -i $u -map 0 -c copy -fflags +bitexact \
                -f framecrc - > van_${k}_all.txt 2> van_${k}_all.err
            rc=$?
            tail -3 van_${k}_all.err
            what="exit $rc"
            if [ $rc = 124 ] || [ $rc = 137 ]; then what="NO RETURN, ended after 60 s"; fi
            same="differ from"
            if cmp -s van_${k}_all.txt pat_${k}_all.txt; then same="are the same as"; fi
            echo "::notice::FFmpeg 9.0 without the series, $w $n.mpd: $what, $(grep -vc '^#' van_${k}_all.txt) packets, $(grep -c . van_${k}_all.err) lines of errors; the packets $same those of the patched build ($(grep -vc '^#' pat_${k}_all.txt))"
          done
        done
        exit 0

    # Patch 0053 must not change what the ffmpeg tool does with the stream
    # specifier forms that existed before: the build tree gets ffmpeg
    # without 0053 (fftools only, the libraries are not touched), both run
    # the same commands on a file with three audio streams (pcm_s16le eng,
    # pcm_alaw deu, pcm_s16le fra) and must write the same file.
    - name: ffmpeg with the old stream specifier forms unchanged by patch 0053
      env:
        LD_LIBRARY_PATH: /home/runner/ffmpeg/lib
      run: |
        set -eux
        NEW="tmo $HOME/ffmpeg/bin/ffmpeg"; FP="tmo $HOME/ffmpeg/bin/ffprobe"
        cd ffsrc
        patch -R -p1 --no-backup-if-mismatch -s < ../ffpatches/0053.diff
        test "$(grep -c stream_specifier_codec fftools/cmdutils.c || true)" = 0
        make -j$(nproc) ffmpeg
        cp ffmpeg ../ffmpeg_old
        patch -p1 --no-backup-if-mismatch -s < ../ffpatches/0053.diff
        make -j$(nproc) ffmpeg
        OLD="tmo $PWD/../ffmpeg_old"
        mkdir ../spec && cd ../spec
        $NEW -nostdin -v error -f lavfi -i sine=1000:d=0.5 -f lavfi -i sine=2000:d=0.5 -f lavfi -i sine=3000:d=0.5 \
            -map 0 -map 1 -map 2 -c:a pcm_s16le -c:a:1 pcm_alaw \
            -metadata:s:a:0 language=eng -metadata:s:a:1 language=deu -metadata:s:a:2 language=fra \
            -disposition:a 0 -disposition:a:1 default -bitexact in.mkv
        list() { $FP -v error -show_entries stream=index,codec_name:stream_disposition=default:stream_tags=language -of compact=p=0:nk=1 "$1"; }
        list in.mkv
        i=0
        while IFS= read -r args; do
          i=$((i+1))
          for b in OLD NEW; do
            ${!b} -nostdin -v error -i in.mkv $args -bitexact -y ${b}_$i.mkv
            list ${b}_$i.mkv > ${b}_$i.txt
          done
          echo "== $i: $args"
          cat NEW_$i.txt
          diff -u OLD_$i.txt NEW_$i.txt
          cmp OLD_$i.mkv NEW_$i.mkv
        done <<'EOF'
        -map 0 -c copy -c:a:1 pcm_mulaw
        -map 0:a:1 -c copy
        -map 0:a:m:language:fra -c copy
        -map 0 -c copy -disposition:a:0 default
        -map 0 -c copy -c:a:m:language:deu pcm_mulaw -metadata:s:a:2 title=x
        -map 0:a -map -0:a:0 -c:a pcm_mulaw -c:a:0 copy
        EOF
        test $i = 6
        # the commands select what they say
        test "$(grep -c pcm_mulaw NEW_1.txt)" = 1
        sed -n 2p NEW_1.txt | grep -q pcm_mulaw
        test "$(grep -c . NEW_2.txt)" = 1
        grep -q pcm_alaw NEW_2.txt
        test "$(grep -c . NEW_3.txt)" = 1
        grep -q fra NEW_3.txt
        test "$(grep -c . NEW_4.txt)" = 3
        # (5: a metadata specifier does not match an output stream at that
        # point, with and without the patch: the stream stays as copied)
        sed -n 2p NEW_5.txt | grep -q pcm_alaw
        # and ffmpeg without the patch does not know the codec form
        if $OLD -nostdin -v error -i in.mkv -map 0 -c copy -c:a:pcm_alaw pcm_mulaw -bitexact -y old_codec.mkv; then
          echo "ffmpeg without patch 0053 accepted -c:a:pcm_alaw"; exit 1
        fi
        $NEW -nostdin -v error -i in.mkv -map 0 -c copy -c:a:pcm_alaw pcm_mulaw -bitexact -y new_codec.mkv
        list new_codec.mkv | tee new_codec.txt
        test "$(grep -c pcm_mulaw new_codec.txt)" = 1
        sed -n 2p new_codec.txt | grep -q pcm_mulaw

    # The patches 0050, 0051 and 0052 must not change anything for a caller
    # that does not switch tracks (and 0050 nothing for HLS without
    # #EXT-X-DISCONTINUITY): the build tree gets libavformat without 0052,
    # 0051 and the hls.c part of 0050 (the installed one keeps them), both
    # read the same streams and must give the same output. The demuxers
    # without the patches also show that track_switch tests something: HLS
    # never delivers the track that is switched in (OE-A patch 0008), DASH
    # starts it somewhere else. Runs last, the tree is not installed again.
    # Before that, patch 0054 alone: without it the tree reads the DASH
    # manifests over HTTP (one file per representation, byte range
    # segments) exactly as the installed libraries with it.
    - name: HLS and DASH unchanged by the patches 0050 to 0052 and 0054 without a track switch
      run: |
        set -eux
        cd ffsrc
        FFS=$PWD
        REF=$PWD/libavutil:$PWD/libavcodec:$PWD/libavformat:$PWD/libavdevice:$PWD/libavfilter:$PWD/libswscale:$PWD/libswresample
        NEW=$HOME/ffmpeg/lib
        (cd ../sw && exec python3 ../.github/ffmpeg9-tests/range_server.py 8089) 2>/dev/null &
        SRV=$!
        trap 'kill $SRV 2>/dev/null || true' EXIT
        sleep 1
        H=http://127.0.0.1:8089
        patch -R -p1 --no-backup-if-mismatch -s < ../ffpatches/0054.diff
        test "$(grep -c segment_is_http libavformat/dashdec.c || true)" = 0
        make -j$(nproc)
        for lib in REF NEW; do
          for n in sf sfm; do
            LD_LIBRARY_PATH=${!lib} tmo ./ffmpeg -nostdin -v error -flags +bitexact -i $H/$n/a.mpd -map 0 \
                -c copy -fflags +bitexact -f framecrc - > ../h54_${n}_all_$lib.txt
            LD_LIBRARY_PATH=${!lib} tmo ./ffmpeg -nostdin -v error -flags +bitexact -ss 7.3 -i $H/$n/a.mpd -map 0 \
                -t 4 -c copy -fflags +bitexact -f framecrc - > ../h54_${n}_seek_$lib.txt
          done
        done
        for n in sf sfm; do
          for t in all seek; do
            wc -l ../h54_${n}_${t}_NEW.txt
            test "$(grep -vc '^#' ../h54_${n}_${t}_NEW.txt)" -gt 0
            diff -u ../h54_${n}_${t}_REF.txt ../h54_${n}_${t}_NEW.txt
            # and the same as the installed ffmpeg read in the step above
            diff -u ../sw/pat_${n}_a_http_${t}.txt ../h54_${n}_${t}_NEW.txt
          done
        done
        test "$(grep -vc '^#' ../h54_sf_all_NEW.txt)" -gt 100
        test "$(grep -vc '^#' ../h54_sfm_all_NEW.txt)" -gt 100
        echo "::notice::patch 0054 over HTTP: the same packets without and with it (sf $(grep -vc '^#' ../h54_sf_all_NEW.txt), sfm $(grep -vc '^#' ../h54_sfm_all_NEW.txt) packets, and with a seek)"
        awk '/^diff --git /{p = ($0 ~ /^diff --git a\/libavformat\/hls\.c /)} p' \
            ../ffpatches/0050.diff > ../hls0050.diff
        test -s ../hls0050.diff
        patch -R -p1 --no-backup-if-mismatch -s < ../ffpatches/0052.diff
        patch -R -p1 --no-backup-if-mismatch -s < ../ffpatches/0051.diff
        patch -R -p1 --no-backup-if-mismatch -s < ../hls0050.diff
        grep -A3 'if (c->first_packet) {' libavformat/hls.c
        make -j$(nproc)
        reflib=$(LD_LIBRARY_PATH=$REF ldd ./ffmpeg | awk '/libavformat/ {print $3}')
        newlib=$(LD_LIBRARY_PATH=$NEW ldd ./ffmpeg | awk '/libavformat/ {print $3}')
        echo "unpatched: $reflib  patched: $newlib"
        test "$(grep -c 'Timeline anchor' "$reflib" || true)" = 0
        test "$(grep -c 'Timeline anchor' "$newlib")" -gt 0
        # FATE test of a tag-less live playlist: both demuxers against the reference
        # (generated by the unpatched one if the patch does not ship it yet)
        T=fate-hls-discontinuity-notag-live
        if [ ! -f tests/ref/fate/hls-discontinuity-notag-live ]; then
          LD_LIBRARY_PATH=$REF TMO=600 tmo make $T GEN=1 || true
        fi
        cat tests/ref/fate/hls-discontinuity-notag-live
        LD_LIBRARY_PATH=$REF TMO=600 tmo make $T
        LD_LIBRARY_PATH=$NEW TMO=600 tmo make $T
        # the same segments as VOD, read through and with a seek
        sed '$a #EXT-X-ENDLIST' tests/data/hls_notag_live.m3u8 > tests/data/hls_notag_vod.m3u8
        cat tests/data/hls_notag_vod.m3u8
        for lib in REF NEW; do
          export LD_LIBRARY_PATH=${!lib}
          tmo ./ffmpeg -nostdin -v error -flags +bitexact -i tests/data/hls_notag_vod.m3u8 \
              -c copy -fflags +bitexact -f framecrc - > ../vod_$lib.txt
          tmo ./ffmpeg -nostdin -v error -flags +bitexact -ss 1.2 -i tests/data/hls_notag_vod.m3u8 \
              -t 1 -c copy -fflags +bitexact -f framecrc - > ../vodseek_$lib.txt
          tmo ./ffmpeg -nostdin -v error -flags +bitexact -live_start_index -2 -max_reload 1 \
              -i tests/data/hls_notag_live.m3u8 -c copy -fflags +bitexact -f framecrc - > ../liveedge_$lib.txt
        done
        # the streams of the track switch check, without a switch: read
        # through, with a seek, and one track only (ffmpeg discards the others)
        for lib in REF NEW; do
          export LD_LIBRARY_PATH=${!lib}
          for n in hls tl dur; do
            cd ../sw/$n
            m=a.mpd; if [ $n = hls ]; then m=master.m3u8; fi
            tmo $FFS/ffmpeg -nostdin -v error -flags +bitexact -i $m -map 0 \
                -c copy -fflags +bitexact -f framecrc - > $FFS/../sw_${n}_all_$lib.txt
            tmo $FFS/ffmpeg -nostdin -v error -flags +bitexact -ss 7.3 -i $m -map 0 \
                -t 4 -c copy -fflags +bitexact -f framecrc - > $FFS/../sw_${n}_seek_$lib.txt
            tmo $FFS/ffmpeg -nostdin -v error -flags +bitexact -i $m -map 0:a:1 \
                -c copy -fflags +bitexact -f framecrc - > $FFS/../sw_${n}_one_$lib.txt
            cd $FFS
          done
        done
        # without the patches the track that is switched in does not arrive
        # (HLS) or not at the playing position (DASH)
        export LD_LIBRARY_PATH=$REF
        (cd ../sw/hls && tmo ../../track_switch master.m3u8 6 none 0.5)
        for n in tl dur; do
          (cd ../sw/$n && tmo ../../track_switch a.mpd 6 far 0.5)
        done
        unset LD_LIBRARY_PATH
        for t in vod vodseek liveedge; do
          cat ../${t}_NEW.txt
          diff -u ../${t}_REF.txt ../${t}_NEW.txt
        done
        for n in hls tl dur; do
          for t in all seek one; do
            wc -l ../sw_${n}_${t}_NEW.txt
            test "$(grep -vc '^#' ../sw_${n}_${t}_NEW.txt)" -gt 100
            diff -u ../sw_${n}_${t}_REF.txt ../sw_${n}_${t}_NEW.txt
          done
        done
        # single-file DASH over HTTP without the patches 0051, 0052 and 0054,
        # not gating (see the step above)
        U=$H/sf/a.mpd
        single_file() {
          for lib in REF NEW; do
            LD_LIBRARY_PATH=${!lib} tmo ./ffmpeg -nostdin -v error -flags +bitexact -i $U -map 0                 -c copy -fflags +bitexact -f framecrc - > ../sw_sf_all_$lib.txt &&
            LD_LIBRARY_PATH=${!lib} tmo ./ffmpeg -nostdin -v error -flags +bitexact -ss 7.3 -i $U -map 0                 -t 4 -c copy -fflags +bitexact -f framecrc - > ../sw_sf_seek_$lib.txt || return 1
          done
          wc -l ../sw_sf_all_NEW.txt ../sw_sf_seek_NEW.txt &&
          test "$(grep -vc '^#' ../sw_sf_all_NEW.txt)" -gt 100 &&
          test "$(grep -vc '^#' ../sw_sf_seek_NEW.txt)" -gt 100 &&
          diff -u ../sw_sf_all_REF.txt ../sw_sf_all_NEW.txt &&
          diff -u ../sw_sf_seek_REF.txt ../sw_sf_seek_NEW.txt &&
          LD_LIBRARY_PATH=$REF tmo ../track_switch $U 6 far 0.5
        }
        single_file || echo "::warning::single-file DASH: the comparison without the patches failed"

    # release/9.0 reads a run of consecutive byte range segments from one
    # request (2120a1d626). The discontinuity patch must end such a run at
    # a #EXT-X-DISCONTINUITY: the two files of the FATE test as ONE file,
    # every region as two byte range segments, give the packets of the
    # two-file playlist, with two requests (one per region), local and over
    # HTTP/1.0 and HTTP/1.1 (kept connections, next segment requested
    # ahead). A stream without the tag as one run gives the packets of its
    # separate segments, and those of the tree without the series.
    # Uses the installed libraries (the build tree is without 0050 to 0052
    # and 0054 at this point).
    - name: HLS byte range segments (upstream 2120a1d626) and the discontinuity patch
      env:
        LD_LIBRARY_PATH: /home/runner/ffmpeg/lib
      run: |
        set -eux
        PAT="tmo $HOME/ffmpeg/bin/ffmpeg"
        VAN=""
        if [ -x ffvan/ffmpeg ]; then VAN="timeout -k 5 60 $PWD/ffvan/ffmpeg"; fi
        SW=$PWD/sw
        mkdir br && cd br
        cp ../ffsrc/tests/data/hls_discontinuity_[01].ts ../ffsrc/tests/data/hls_notag_live_*.ts .
        python3 ../.github/ffmpeg9-tests/byterange_playlists.py .
        ls -l
        cat disc.m3u8 disc_br.m3u8 nt.m3u8 nt_br.m3u8
        rd()   { "$@" -c copy -fflags +bitexact -f framecrc -; }
        inp()  { echo "-nostdin -v error -flags +bitexact -i $1"; }
        reqs() { $PAT -nostdin -v verbose -i $1 -c copy -f null - 2>&1 | grep -c "HLS request for url" || true; }
        rd $PAT $(inp disc.m3u8)    > disc.txt
        rd $PAT $(inp disc_br.m3u8) > disc_br.txt
        rd $PAT $(inp nt.m3u8)      > nt.txt
        rd $PAT $(inp nt_br.m3u8)   > nt_br.txt
        cat disc_br.txt
        test "$(grep -vc '^#' disc.txt)" = 10
        test "$(grep -vc '^#' nt.txt)" = 15
        diff -u disc.txt disc_br.txt
        diff -u nt.txt nt_br.txt
        r_disc=$(reqs disc_br.m3u8); r_nt=$(reqs nt_br.m3u8)
        echo "::notice::byte range HLS, local: $r_disc requests for the two regions of disc_br.m3u8, $r_nt for the run of nt_br.m3u8; the packets are those of the separate files"
        test "$r_disc" = 2
        test "$r_nt" = 1
        # seeks: into the first region, to the start of the second one and
        # into its second byte range segment (not gating)
        for ss in 0.7 1.2 1.7; do
          for p in disc disc_br; do
            $PAT -nostdin -v error -flags +bitexact -ss $ss -i $p.m3u8 -t 0.4 -c copy -fflags +bitexact -f framecrc - > seek_${p}_$ss.txt || true
          done
          if cmp -s seek_disc_$ss.txt seek_disc_br_$ss.txt; then
            echo "::notice::byte range HLS, seek to $ss: the same $(grep -vc '^#' seek_disc_br_$ss.txt) packets as with separate files"
          else
            echo "::warning::byte range HLS, seek to $ss: packets differ from the separate files"
            diff -u seek_disc_$ss.txt seek_disc_br_$ss.txt || true
          fi
        done
        python3 ../.github/ffmpeg9-tests/range_server.py 8090 &
        SRV0=$!
        python3 ../.github/ffmpeg9-tests/range_server.py 8091 1.1 &
        SRV1=$!
        trap 'kill $SRV0 $SRV1 2>/dev/null || true' EXIT
        sleep 1
        for port in 8090 8091; do
          H=http://127.0.0.1:$port
          for opt in "" "-http_persistent 0" "-http_multiple 1" "-http_multiple 0"; do
            for p in disc disc_br nt nt_br; do
              rd $PAT -nostdin -v error -flags +bitexact $opt -i $H/$p.m3u8 > http.txt
              diff -u ${p%_br}.txt http.txt
            done
          done
          echo "::notice::byte range HLS over HTTP (port $port, $(curl -sI $H/disc.m3u8 | head -1 | tr -d '\r')): the packets of the local files, $(reqs $H/disc_br.m3u8) requests for disc_br.m3u8, $(reqs $H/nt_br.m3u8) for nt_br.m3u8"
        done
        # the tree without the series: the same packets for the stream
        # without the tag (information)
        if [ -n "$VAN" ]; then
          set +e
          for u in nt.m3u8 nt_br.m3u8 http://127.0.0.1:8090/nt_br.m3u8 http://127.0.0.1:8091/nt_br.m3u8 http://127.0.0.1:8091/nt.m3u8; do
            rd $VAN $(inp $u) > van.txt 2> van.err
            rc=$?
            if cmp -s nt.txt van.txt; then
              echo "::notice::tree without the series, $u: exit $rc, the same $(grep -vc '^#' van.txt) packets as with the series"
            else
              echo "::warning::tree without the series, $u: exit $rc, $(grep -vc '^#' van.txt) packets, they differ from those with the series"
              tail -3 van.err; diff -u nt.txt van.txt | head -20
            fi
          done
          rd $VAN $(inp disc.m3u8) > van_disc.txt 2> van.err
          echo "::notice::tree without the series, disc.m3u8 (no discontinuity support there): exit $?, $(grep -vc '^#' van_disc.txt) packets, $(diff disc.txt van_disc.txt | grep -c '^>') of them differ from those with the series"
          # the HLS stream of the track switch check (H.264 and two AAC
          # renditions), read through and with a seek
          cd $SW/hls
          for t in all seek; do
            a=""; b=""
            if [ $t = seek ]; then a="-ss 7.3"; b="-t 4"; fi
            $PAT -nostdin -v error -flags +bitexact $a -i master.m3u8 -map 0 $b -c copy -fflags +bitexact -f framecrc - > ../../br/swhls_pat_$t.txt 2> /dev/null
            $VAN -nostdin -v error -flags +bitexact $a -i master.m3u8 -map 0 $b -c copy -fflags +bitexact -f framecrc - > ../../br/swhls_van_$t.txt 2> ../../br/van.err
            rc=$?
            if cmp -s ../../br/swhls_pat_$t.txt ../../br/swhls_van_$t.txt; then
              echo "::notice::tree without the series, HLS with two audio renditions ($t): exit $rc, the same $(grep -vc '^#' ../../br/swhls_van_$t.txt) packets as with the series"
            else
              echo "::warning::tree without the series, HLS with two audio renditions ($t): exit $rc, $(grep -vc '^#' ../../br/swhls_van_$t.txt) packets, with the series $(grep -vc '^#' ../../br/swhls_pat_$t.txt); they differ"
              tail -3 ../../br/van.err; diff -u ../../br/swhls_pat_$t.txt ../../br/swhls_van_$t.txt | head -30
            fi
          done
        else
          echo "::warning::no ffmpeg of the tree without the series, comparison skipped"
        fi
        exit 0

  # skyjet18/exteplayer3 master built the way its tests/build.sh does it:
  # against a static, out-of-tree build of the series. Its unit tests
  # (tests/run.sh) run as information.
  exteplayer3-skyjet:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
    - uses: actions/checkout@v4
    - name: Commit of the series
      id: pin
      run: echo "sha=$(cat .github/ffmpeg9-tests/ffmpeg-commit)" >> "$GITHUB_OUTPUT"
    - uses: actions/checkout@v4
      with:
        repository: Masta2002/FFmpeg
        ref: ci/sky-9.0-patched
        path: ffsrc
    - uses: actions/checkout@v4
      with:
        repository: skyjet18/exteplayer3
        path: skyjet
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential pkg-config nasm libxml2-dev libssl-dev zlib1g-dev
    - name: Static FFmpeg of the series
      run: |
        set -eux
        test "$(git -C ffsrc rev-parse HEAD)" = "${{ steps.pin.outputs.sha }}"
        mkdir ffbuild && cd ffbuild
        ../ffsrc/configure --disable-autodetect --disable-doc --disable-ffplay \
          --enable-version3 --enable-libxml2 --enable-openssl --enable-zlib
        make -j$(nproc)
    - name: exteplayer3 of skyjet18 master (tests/build.sh)
      run: |
        set -eux
        cd skyjet
        git log -1 --format='%H %ad %s'
        grep -n 'EPLAYER3_EXTENDED.*version' main/exteplayer.c
        export FFMPEG_SOURCE=$GITHUB_WORKSPACE/ffsrc FFMPEG_BUILD=$GITHUB_WORKSPACE/ffbuild
        export FFMPEG_EXTRA_LIBS="-lxml2 -lssl -lcrypto -lz"
        export CFLAGS="-O2 -Werror=implicit-function-declaration -Werror=incompatible-pointer-types -Werror=int-conversion"
        mkdir ../out
        sh tests/build.sh ../out/exteplayer3-host
        ls -l ../out
        ../out/exteplayer3-host 2>&1 | head -5 || true
    - name: Unit tests of skyjet18/exteplayer3 (information)
      run: |
        set +e -ux
        cd skyjet
        export FFMPEG_SOURCE=$GITHUB_WORKSPACE/ffsrc FFMPEG_BUILD=$GITHUB_WORKSPACE/ffbuild
        export FFMPEG_EXTRA_LIBS="-lxml2 -lssl -lcrypto -lz"
        timeout -k 10 900 sh tests/run.sh
        rc=$?
        if [ $rc = 0 ]; then
          echo "::notice::skyjet18/exteplayer3 tests/run.sh against the series: passed"
        else
          echo "::warning::skyjet18/exteplayer3 tests/run.sh against the series: exit $rc"
        fi
        exit 0

  # The maintainer builds for old images with an old GCC and glibc (OpenPLi
  # 4). Not that environment: libavutil, libavcodec and libavformat of the
  # tree without the series and of the series, natively on x86_64 with the
  # GCC of the old gcc Docker images, minimal configure. Information: shows
  # whether both trees pass or fail alike, never fails the run.
  old-gcc:
    name: old GCC ${{ matrix.gcc }} (information)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        gcc: ['4.9', '5', '6', '7', '8']
    steps:
    - uses: actions/checkout@v4
    - uses: actions/checkout@v4
      with:
        repository: skyjet18/FFmpeg
        ref: d838f9f9aeb0e09b4d068e2af20a46a12640696f
        path: stock
    - uses: actions/checkout@v4
      with:
        repository: Masta2002/FFmpeg
        ref: ci/sky-9.0-patched
        path: series
    - name: Compile both trees with GCC ${{ matrix.gcc }}
      run: |
        set +e -ux
        git -C stock log -1 --format='%H %s'
        git -C series log -1 --format='%H %s'
        docker pull -q gcc:${{ matrix.gcc }} || { echo "::warning::gcc:${{ matrix.gcc }}: image not available"; exit 0; }
        docker run --rm -v "$PWD:/w" -w /w gcc:${{ matrix.gcc }} sh /w/.github/ffmpeg9-tests/old_gcc.sh stock series
        for t in stock series; do
          echo "::notice::GCC ${{ matrix.gcc }}, $t: $(cat $t.result)"
        done
        if cmp -s stock.failed series.failed; then
          echo "::notice::GCC ${{ matrix.gcc }}: the same $(grep -c . stock.failed) files fail to compile in both trees"
        else
          echo "::warning::GCC ${{ matrix.gcc }}: the trees differ in the files that fail to compile"
          diff stock.failed series.failed
        fi
        exit 0
