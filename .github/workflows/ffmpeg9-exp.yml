name: FFmpeg 9 series, cases of the receiver test

# The network cases of the receiver test (skyjet18/exteplayer3 186 against
# FFmpeg 6.1 and against the series on a Vu+ Uno 4K SE) that failed with the
# series only, read here without a receiver: boxplay.c makes the calls of
# the player, ep3http.py and genmedia_net.py are the test server and the
# media generator of the receiver test. Two builds are compared: the series
# as it was tested on the receiver (.github/ffmpeg9-box/ffmpeg-commit-old)
# and the commit the main workflow tests
# (.github/ffmpeg9-tests/ffmpeg-commit). check.py is the verdict: the
# earlier build has to show the failures of the receiver (the cases
# reproduce them), the current one must not:
# - DASH VOD (SegmentTimeline, SegmentList, single file with SegmentBase):
#   seeks after the stream was read to its end
# - HLS VOD with #EXT-X-DISCONTINUITY and a part 1000 s later: continuous
#   timestamps while reading through and after seeks
# - live DASH, SegmentTemplate with a duration, no
#   suggestedPresentationDelay: starts, and reads on at the live edge
# - hls_audio_default_only
# - live HLS that ends: under valgrind, with reads after the end (the
#   SIGSEGV of the receiver is not reproduced by it, also not by the player
#   itself in the last step)
# Builds and media are cached, a run takes a few minutes.

on:
  push:
    paths:
      - '.github/ffmpeg9-box/**'
      - '.github/ffmpeg9-tests/ffmpeg-commit'
      - '.github/workflows/ffmpeg9-exp.yml'
  workflow_dispatch:

jobs:
  cases:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v4

    - name: Commits
      id: pin
      run: |
        echo "new=$(cat .github/ffmpeg9-tests/ffmpeg-commit)" >> "$GITHUB_OUTPUT"
        echo "old=$(cat .github/ffmpeg9-box/ffmpeg-commit-old)" >> "$GITHUB_OUTPUT"

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential pkg-config nasm valgrind \
          libxml2-dev libssl-dev zlib1g-dev libx264-dev

    - name: Build of the series (cache)
      id: cnew
      uses: actions/cache@v4
      with:
        path: ~/ff-new
        key: ffbox-${{ steps.pin.outputs.new }}

    - name: Build of the receiver test state (cache)
      id: cold
      uses: actions/cache@v4
      with:
        path: ~/ff-old
        key: ffbox-${{ steps.pin.outputs.old }}

    - name: Source of the series
      if: steps.cnew.outputs.cache-hit != 'true'
      uses: actions/checkout@v4
      with:
        repository: Masta2002/FFmpeg
        ref: ${{ steps.pin.outputs.new }}
        path: src-new

    - name: Source of the receiver test state
      if: steps.cold.outputs.cache-hit != 'true'
      uses: actions/checkout@v4
      with:
        repository: Masta2002/FFmpeg
        ref: ${{ steps.pin.outputs.old }}
        path: src-old

    - name: Build what is not cached
      run: |
        set -eu
        for l in new old; do
          if [ -d src-$l ]; then
            (cd src-$l &&
             ./configure --prefix=$HOME/ff-$l --enable-shared --disable-static --disable-doc \
               --enable-gpl --enable-version3 --enable-libxml2 --enable-openssl --enable-libx264 --enable-zlib > /dev/null &&
             make -j$(nproc) install > /dev/null 2> ../make-$l.err) || { tail -40 make-$l.err; exit 1; }
          fi
          ls $HOME/ff-$l/lib | head -3
        done

    - name: Media (cache)
      id: cmedia
      uses: actions/cache@v4
      with:
        path: .github/ffmpeg9-box/media4/net
        key: boxmedia-${{ hashFiles('.github/ffmpeg9-box/genmedia_net.py') }}

    - name: Generate the media
      if: steps.cmedia.outputs.cache-hit != 'true'
      run: |
        set -eux
        cd .github/ffmpeg9-box
        pip install --quiet --target ffpy imageio-ffmpeg==0.8.1 || pip install --quiet --target ffpy imageio-ffmpeg
        ls -l ffpy/imageio_ffmpeg/binaries
        python3 genmedia_net.py
        rm -rf media4/_src
        du -sh media4/net

    - name: The cases with both builds
      run: |
        set -u
        B=$PWD/.github/ffmpeg9-box
        bash $B/exp.sh old $HOME/ff-old $B/media4 $PWD/out 8099 2>&1 | tee out_old.txt
        bash $B/exp.sh new $HOME/ff-new $B/media4 $PWD/out 8098 2>&1 | tee out_new.txt
        echo "=================== differences (old | new)"
        for f in out/*__new.txt; do
          o=${f%__new.txt}__old.txt
          if ! cmp -s $o $f; then echo "--- $(basename ${f%__new.txt})"; diff $o $f || true; fi
        done

    - name: Verdict
      run: |
        python3 .github/ffmpeg9-box/check.py out | tee verdict.txt
        test "${PIPESTATUS[0]}" = 0
        grep '^ok ' verdict.txt | sed 's/^ok  */::notice::/'

    # The live HLS stream that ends, with the player itself (host build,
    # outputs to /dev/null) under valgrind: on the receiver the player
    # built against the series ended with SIGSEGV in this case.
    - name: skyjet18/exteplayer3 on the live HLS stream that ends (information)
      if: always()
      run: |
        set +e -ux
        B=$PWD/.github/ffmpeg9-box
        git clone --depth 1 https://github.com/skyjet18/exteplayer3 skyjet
        cd skyjet
        for l in old new; do
          P=$HOME/ff-$l
          gcc -O1 -g -D_FILE_OFFSET_BITS=64 -D_LARGEFILE64_SOURCE -D_LARGEFILE_SOURCE -DHAVE_FLV2MPEG4_CONVERTER \
            -DEXTEPLAYER_FAKE_VIDEO='"/dev/null"' -DEXTEPLAYER_FAKE_AUDIO='"/dev/null"' -DEXTEPLAYER_TERM_SOCKET='""' \
            -Wno-deprecated-declarations -Iinclude -Iexternal -Iexternal/flv2mpeg4 \
            $(PKG_CONFIG_PATH=$P/lib/pkgconfig pkg-config --cflags libavformat libavcodec libswresample libswscale libavutil) \
            main/exteplayer.c tools/debug.c tools/strbuffer.c tools/pcm_export.c \
            container/container.c container/container_ffmpeg.c \
            manager/manager.c manager/audio.c manager/video.c manager/subtitle.c \
            playback/playback.c output/output.c output/output_subtitle.c output/graphic_subtitle.c \
            output/linuxdvb_fake.c output/linuxdvb_buffering.c \
            output/writer/common/pes.c output/writer/common/misc.c output/writer/common/writer.c \
            output/writer/mipsel/*.c external/ffmpeg/src/bitstream.c \
            external/ffmpeg/src/latmenc.c external/ffmpeg/src/mpeg4audio.c \
            external/flv2mpeg4/src/*.c external/plugins/src/png.c \
            $(PKG_CONFIG_PATH=$P/lib/pkgconfig pkg-config --libs libavformat libavcodec libswresample libswscale libavutil) \
            -pthread -lm -ldl -o ../exteplayer3_$l 2> ../player_build_$l.err || { tail -20 ../player_build_$l.err; continue; }
          EP3_ROOT=$B/media4 python3 $B/ep3http.py 8097 ../out/srv_player_$l.log 2> /dev/null &
          SRV=$!
          sleep 1
          for tool in "" "valgrind -q --num-callers=30"; do
            (sleep 60) | LD_LIBRARY_PATH=$P/lib timeout -k 5 90 $tool ../exteplayer3_$l \
              "http://127.0.0.1:8097/hlive/index.m3u8?win=6&end=30&s=p$l${tool:+v}" > ../out/player_${l}${tool:+_vg}.out 2> ../out/player_${l}${tool:+_vg}.err
            echo "== player with the $l build${tool:+ under valgrind}: exit $?"
            tail -5 ../out/player_${l}${tool:+_vg}.out
            tail -40 ../out/player_${l}${tool:+_vg}.err | cut -c1-300
          done
          kill $SRV
        done
        exit 0

    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: box-cases
        path: |
          out
          out_old.txt
          out_new.txt
